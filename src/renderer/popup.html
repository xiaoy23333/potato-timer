<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>提醒</title>
    <link rel="stylesheet" href="shared/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!--
      提醒弹窗（对应 计划.md 1.3）：
      顶部居中、无边框、置顶、不抢焦点、不会自己退回去。
      两个出口：按钮 / 全局快捷键 = 延后 5 分钟；滑块拖到最右端 = 进入下一轮。
    -->
    <div class="card">
      <div class="head">
        <span class="dot" id="dot"></span>
        <span class="title" id="title">专注结束</span>
      </div>

      <div class="row">
        <button class="btn-snooze" id="btnSnooze" type="button">
          <span class="btn-main" id="snoozeText">5 分钟后再提醒</span>
          <kbd class="btn-kbd" id="hotkeyHint">Ctrl+Alt+P</kbd>
        </button>

        <div class="slider" id="slider" role="slider" aria-label="滑动开始下一轮" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0">
          <div class="fill" id="fill"></div>
          <div class="label" id="sliderLabel">滑动开始下一轮</div>
          <div class="knob" id="knob">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
        </div>
      </div>
    </div>

    <script src="shared/util.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
