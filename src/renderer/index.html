<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>番茄钟</title>
    <link rel="stylesheet" href="shared/theme.css" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <!-- 无边框自绘标题栏：左边是应用名，右边是设置 / 最小化到托盘 / 退出 -->
    <header class="titlebar">
      <div class="tb-left">
        <span class="logo"></span>
        <span class="app-name">番茄钟</span>
      </div>
      <div class="tb-right">
        <button class="tb-btn" id="btnSettings" type="button" title="设置" aria-label="设置">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8" />
            <path
              d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.7 8a1.7 1.7 0 0 0-.4-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V2a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H22a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button class="tb-btn" id="btnMin" type="button" title="最小化到托盘（计时继续）" aria-label="最小化到托盘">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
        <button class="tb-btn tb-close" id="btnClose" type="button" title="退出番茄钟" aria-label="退出">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </header>

    <div class="stage">
      <!-- ————————————— 主视图 ————————————— -->
      <section class="page page-main" id="pageMain">
        <div class="phase-wrap">
          <span class="phase-badge" id="phaseBadge">专注</span>
          <div class="dots" id="dots"></div>
        </div>

        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 220 220" aria-hidden="true">
            <circle class="ring-track" cx="110" cy="110" r="96" />
            <circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="96" />
          </svg>
          <div class="ring-center">
            <div class="time" id="time">40:00</div>
            <div class="status" id="status">准备开始</div>
          </div>
        </div>

        <div class="controls">
          <button class="btn btn-primary" id="btnPrimary" type="button">开始专注</button>
          <div class="controls-sub">
            <button class="btn btn-ghost" id="btnSkip" type="button">跳过</button>
            <button class="btn btn-ghost" id="btnReset" type="button">重置</button>
          </div>
        </div>

        <div class="hint" id="hint">提醒时的延后快捷键 Ctrl + Alt + P</div>
      </section>

      <!-- ————————————— 设置面板 ————————————— -->
      <section class="page page-settings" id="pageSettings" hidden>
        <div class="settings-head">
          <button class="tb-btn" id="btnBack" type="button" title="返回" aria-label="返回">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <span class="settings-title">设置</span>
        </div>

        <div class="settings-body">
          <div class="group">
            <div class="group-title">计时</div>
            <label class="field">
              <span>专注时长</span>
              <span class="field-end">
                <input type="number" id="focusMin" min="0" max="180" step="1" /><em>分</em>
                <input type="number" id="focusSec" min="0" max="59" step="1" /><em>秒</em>
              </span>
            </label>
            <label class="field">
              <span>短休时长</span>
              <span class="field-end">
                <input type="number" id="shortBreakMin" min="0" max="120" step="1" /><em>分</em>
                <input type="number" id="shortBreakSec" min="0" max="59" step="1" /><em>秒</em>
              </span>
            </label>
            <label class="field">
              <span>长休时长</span>
              <span class="field-end">
                <input type="number" id="longBreakMin" min="0" max="120" step="1" /><em>分</em>
                <input type="number" id="longBreakSec" min="0" max="59" step="1" /><em>秒</em>
              </span>
            </label>
            <label class="field">
              <span>每几轮进长休</span>
              <span class="field-end"><input type="number" id="longBreakEvery" min="1" max="12" step="1" /><em>轮</em></span>
            </label>
            <p class="note">时长可以精确到秒。休息时长设为 0 分 0 秒就是跳过休息，直接开始下一轮专注。改动对正在跑的这一轮立即生效。</p>
          </div>

          <div class="group">
            <div class="group-title">提醒</div>
            <label class="field">
              <span>延后时长</span>
              <span class="field-end">
                <input type="number" id="snoozeMin" min="0" max="60" step="1" /><em>分</em>
                <input type="number" id="snoozeSec" min="0" max="59" step="1" /><em>秒</em>
              </span>
            </label>
            <div class="field">
              <span>全局快捷键</span>
              <button class="hotkey" id="hotkeyBtn" type="button">Ctrl + Alt + P</button>
            </div>
            <p class="note" id="hotkeyNote">点击上面的按钮，然后按下新的组合键（需包含 Ctrl 或 Alt）。</p>

            <div class="field">
              <span>提示音</span>
              <label class="switch"><input type="checkbox" id="soundEnabled" /><i></i></label>
            </div>
            <label class="field">
              <span>音量</span>
              <span class="field-end">
                <input type="range" id="soundVolume" min="0" max="1" step="0.05" />
                <em id="soundVolumeText">60%</em>
              </span>
            </label>
            <button class="btn btn-ghost wide" id="btnPreview" type="button">试听提示音</button>
          </div>

          <div class="group">
            <div class="group-title">四周光效</div>
            <label class="field">
              <span>颜色</span>
              <input type="color" id="glowColor" />
            </label>
            <label class="field">
              <span>强度</span>
              <span class="field-end">
                <input type="range" id="glowIntensity" min="0.1" max="1" step="0.05" />
                <em id="glowIntensityText">80%</em>
              </span>
            </label>
            <label class="field">
              <span>闪光时长</span>
              <span class="field-end">
                <input type="range" id="glowFlash" min="0.4" max="4" step="0.2" />
                <em id="glowFlashText">1.4s</em>
              </span>
            </label>
            <p class="note">到点时四周的光只闪一次，闪完保持常亮，不会一直闪。</p>
          </div>

          <div class="group">
            <div class="group-title">小浮窗</div>
            <div class="field">
              <span>显示小浮窗</span>
              <label class="switch"><input type="checkbox" id="floatEnabled" /><i></i></label>
            </div>
            <div class="field">
              <span>可以拖动</span>
              <label class="switch"><input type="checkbox" id="floatDraggable" /><i></i></label>
            </div>
            <label class="field">
              <span>倒计时颜色</span>
              <input type="color" id="floatColor" />
            </label>
            <p class="note">关闭「可以拖动」时，小浮窗完全点击穿透，绝不会挡住鼠标操作。</p>
            <p class="note">倒计时颜色一个管全部状态（专注 / 休息 / 空闲）。背景是完全透明的，所以颜色选得越亮越显眼。</p>
          </div>

          <div class="group">
            <div class="group-title">其它</div>
            <div class="field">
              <span>开机自启</span>
              <label class="switch"><input type="checkbox" id="autoLaunch" /><i></i></label>
            </div>
            <button class="btn btn-ghost wide" id="btnResetConfig" type="button">恢复默认设置</button>
          </div>
        </div>
      </section>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="shared/util.js"></script>
    <script src="shared/sound.js"></script>
    <script src="index.js"></script>
  </body>
</html>
